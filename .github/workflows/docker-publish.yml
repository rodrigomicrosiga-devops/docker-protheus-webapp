name: Docker Build & Push WebApp to Docker Hub

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-push:
    name: Build and Push WebApp Image on Local Infrastructure
    runs-on: self-hosted

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Resgatar WebApp Proprietário no Workspace
        run: |
          cp ../../webapp.tar.gz . 2>/dev/null || cp "${{ github.workspace }}/../webapp.tar.gz" . 2>/dev/null || cp /media/rodrigo/dados/docker-protheus-webapp/webapp.tar.gz .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: rodrigomicrosiga/webapp-dev:10.2.0